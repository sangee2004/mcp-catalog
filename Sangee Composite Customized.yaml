type: vmcp
entryKey: sangee-composite-customized
displayName: Sangee Composite Customized
components:
  - id: default-gmail-8a99d8be
    name: Gmail
    mcpServerCatalogEntryKey: github.com/obot-platform/mcp-catalog/v2-schema::obot-gmail
    toolPrefix: my_configured_
    toolOverrides:
      - name: list_emails
        overrideDescription: List emails in the current user's Gmail account with many advanced filtering options.
        enabled: true
      - name: read_email
        enabled: true
      - name: delete_email
  - id: default-exa-search-ee44b5ae
    name: Exa Search
    mcpServerCatalogEntryKey: github.com/obot-platform/mcp-catalog/v2-schema::obot-exa-search
    configuration:
      - key: EXA_TOOLS
        policy: userAllowed
      - key: X-API-KEY
        policy: userAllowed
    toolOverrides:
      - name: web_search_exa
profiles:
  - name: acr1-everything
    subjects:
      - type: selector
        id: '*'
    vmcpPermissions:
      allowAllComponents: true
